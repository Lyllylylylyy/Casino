<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0b1a">
<title>Casino Fictif</title>
<style>
:root{--bg:#0b0b1a;--panel:#16163a;--panel2:#1f1f4d;--line:#2d2d68;--gold:#ffd24a;--green:#2ee59d;--red:#ff4d6d;--purple:#8b5cf6;--txt:#f1f2ff;--mut:#8e91bd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;overflow:hidden}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative;padding-top:env(safe-area-inset-top);background:radial-gradient(circle at 50% -10%,#1d1d52,var(--bg) 60%)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:linear-gradient(#1b1b44,#12122c);border-bottom:1px solid var(--line)}
.lbl{font-size:11px;letter-spacing:1.5px;color:var(--mut);font-weight:700}
.fake{background:#3a1d5c;color:#d9b8ff;border-radius:6px;padding:1px 6px;margin-left:4px;font-size:10px}
.bal{font-size:28px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:0 0 14px #ffb30055}
.bal.up{animation:flashUp .6s}.bal.down{animation:flashDown .6s}
@keyframes flashUp{0%{color:#fff;text-shadow:0 0 20px var(--green)}100%{color:var(--gold)}}
@keyframes flashDown{0%{color:var(--red)}100%{color:var(--gold)}}
.hr{display:flex;gap:8px}
.mini{background:#26265a;border:1px solid var(--line);color:#fff;border-radius:12px;padding:8px 11px;font-weight:700;font-size:14px}
main{flex:1;position:relative;overflow:hidden}
.screen{display:none;position:absolute;inset:0;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
.screen.on{display:block}
nav{display:flex;background:#12122c;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 0 7px;font-size:12px;font-weight:700}
nav button span{display:block;font-size:21px;margin-bottom:1px}
nav button.on{color:var(--gold)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px}
h2{margin:6px 2px 10px;font-size:15px;letter-spacing:1px;color:var(--mut);text-transform:uppercase}
.btn{border:0;border-radius:15px;padding:15px 12px;font-weight:900;font-size:16px;color:#2a1c00;background:linear-gradient(#ffe27a,#ffb300);box-shadow:0 4px 0 #a06b00;width:100%}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a06b00}
.btn.green{background:linear-gradient(#6df2bd,#12b87a);box-shadow:0 4px 0 #0a7a52;color:#04281a}
.btn.green:active{box-shadow:0 1px 0 #0a7a52}
.btn.ghost{background:#2b2b66;color:#fff;box-shadow:0 4px 0 #15153a}
.btn.ghost:active{box-shadow:0 1px 0 #15153a}
.btn.on{background:linear-gradient(#ff8fa3,#ff4d6d);color:#fff;box-shadow:0 4px 0 #a02040}
.btn:disabled{opacity:.45}
.btn.sm{padding:10px 12px;font-size:14px;width:auto}
.row{display:flex;gap:8px;margin-top:10px}.row .btn{flex:1}.row .btn.ghost{flex:0 0 21%;padding:15px 2px}#pl-drop{font-size:15px;padding:15px 6px}
.seg{display:flex;background:#0d0d27;border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:10px 4px;border-radius:10px;font-weight:800;font-size:14px}
.seg button.on{background:#3b3b90;color:#fff}
.betbox{display:flex;gap:6px;align-items:center;margin-top:10px}
.betbox.lock{pointer-events:none;opacity:.45}
.betbox button{background:#2b2b66;border:0;color:#fff;border-radius:11px;padding:11px 0;width:44px;font-weight:800;font-size:15px}
.betbox .betv{flex:1;text-align:center;font-size:20px;font-weight:900;color:var(--gold);background:#0d0d27;border-radius:11px;padding:8px 0;font-variant-numeric:tabular-nums}
.gh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.gh b{font-size:18px}.gh .sp{width:70px}
.back{background:#26265a;border:1px solid var(--line);color:#fff;border-radius:12px;padding:8px 12px;font-weight:700;width:70px}
.cv{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#0d0d2b;margin-bottom:12px}
canvas{display:block;width:100%;height:auto}
.last{display:flex;gap:6px;min-height:28px;margin-bottom:8px;overflow:hidden}
.chip{border-radius:9px;padding:4px 9px;font-size:13px;font-weight:900;background:#2b2b66;white-space:nowrap}
.chip.w{background:#115c42;color:#7dffcb}.chip.l{background:#5c1a2c;color:#ff9db1}
.balls{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.bc{width:40px;height:40px;border-radius:50%;border:2px solid #3b3b90;background:#0d0d27;padding:0;display:flex;align-items:center;justify-content:center}
.bc.on{border-color:var(--gold);box-shadow:0 0 12px #ffd24a77}
.bc i,.dot{display:block;width:24px;height:24px;border-radius:50%}
.bn{font-size:12px;color:var(--mut);flex:1;min-width:120px}
.muted{color:var(--mut);font-size:13px}
.msg{min-height:26px;text-align:center;font-weight:800;font-size:16px;margin:4px 0 8px}
.msg.w{color:var(--green)}.msg.l{color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gc{background:linear-gradient(160deg,#20205a,#14143a);border:1px solid var(--line);border-radius:18px;padding:14px 12px;text-align:left;color:var(--txt);position:relative;min-height:128px}
.gc .em{font-size:34px}.gc b{display:block;font-size:16px;margin:4px 0 2px}.gc small{color:var(--mut);font-size:12px;line-height:1.25;display:block}
.gc.lock{opacity:.75}.gc .tag{position:absolute;top:10px;right:10px;font-size:12px;font-weight:800;background:#0d0d27;border-radius:9px;padding:3px 8px;color:var(--gold)}
.hero{text-align:center;padding:10px 0 14px}.hero .t{font-size:26px;font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#ffd24a,#ff7ac6,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .s{font-size:12px;color:var(--mut);margin-top:3px}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid #25255a}.item:first-of-type{border-top:0}
.item .ic{width:46px;height:46px;border-radius:14px;background:#0d0d27;display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 46px}
.item .tx{flex:1;min-width:0}.item .tx b{display:block;font-size:15px}.item .tx small{color:var(--mut);font-size:12px;line-height:1.25;display:block}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{background:#0d0d27;border-radius:13px;padding:10px}.kv small{display:block;color:var(--mut);font-size:11px;letter-spacing:1px;font-weight:700}.kv b{font-size:17px;font-variant-numeric:tabular-nums}
.pos{color:var(--green)}.neg{color:var(--red)}
.hist{font-size:13px}.hist div{display:flex;justify-content:space-between;gap:8px;padding:7px 2px;border-top:1px solid #25255a}.hist div:first-child{border-top:0}
.coinwrap{perspective:800px;height:180px;display:flex;justify-content:center;align-items:center}
#coinhop.hop{animation:hop 1.2s ease-out}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-70px)}100%{transform:translateY(0)}}
#coin{width:124px;height:124px;position:relative;transform-style:preserve-3d;transition:transform 1.2s cubic-bezier(.2,.7,.25,1)}
.face{position:absolute;inset:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:58px;font-weight:900;-webkit-backface-visibility:hidden;backface-visibility:hidden;color:#6b4500;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc83d 55%,#b8800f);border:6px solid #e6a800;box-shadow:inset 0 0 14px #0005,0 6px 18px #0008}
.face small{font-size:12px;letter-spacing:3px;margin-top:-6px}.face.b{transform:rotateY(180deg)}
.dice-n{text-align:center;font-size:56px;font-weight:900;font-variant-numeric:tabular-nums;margin:4px 0}
.bar{position:relative;height:22px;border-radius:11px;margin:6px 4px 16px}
.mk{position:absolute;top:-8px;width:6px;height:38px;border-radius:3px;background:#fff;box-shadow:0 0 10px #fff;transform:translateX(-3px);transition:left .25s}
input[type=range]{width:100%;margin:10px 0 4px;accent-color:var(--gold);height:30px}
.stats3{display:flex;gap:8px}.stats3 div{flex:1;background:#0d0d27;border-radius:12px;padding:8px;text-align:center;font-size:11px;color:var(--mut);font-weight:700}.stats3 b{display:block;font-size:17px;color:#fff;margin-top:2px}
.reels{display:flex;gap:10px;justify-content:center;margin:8px 0 12px}
.reel{width:92px;height:104px;border-radius:18px;background:linear-gradient(#f5f5ff,#c9c9e8 50%,#f5f5ff);display:flex;align-items:center;justify-content:center;font-size:56px;border:3px solid #5b5bb8;box-shadow:inset 0 0 18px #0006}
.reel.pop{animation:pop .3s}@keyframes pop{50%{transform:scale(1.12)}}
.reel.win{box-shadow:0 0 22px var(--gold),inset 0 0 18px #0006;border-color:var(--gold)}
.pt{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:13px;margin-bottom:6px}.pt div{display:flex;justify-content:space-between}.pt b{color:var(--gold)}
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:12px}
.tile{aspect-ratio:1;border-radius:13px;border:0;background:linear-gradient(#34349a,#25256f);font-size:26px;box-shadow:0 4px 0 #14143e;color:#fff;padding:0}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 #14143e}
.tile.safe{background:linear-gradient(#0f7f58,#0a5a3f);box-shadow:none;animation:pop .3s}
.tile.bomb{background:linear-gradient(#a02040,#6b1429);box-shadow:none}
.tile.dim{opacity:.4;box-shadow:none;background:#25256f}
.mi{display:flex;gap:8px;margin-bottom:10px}.mi div{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px;text-align:center;font-size:11px;color:var(--mut);font-weight:700}.mi b{display:block;font-size:20px;color:var(--gold)}
#toast{position:absolute;left:50%;top:70px;transform:translate(-50%,-20px);background:#2b2b66;border:1px solid #5b5bb8;padding:10px 16px;border-radius:14px;font-weight:800;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.good{background:#0f5c42;border-color:var(--green)}#toast.bad{background:#5c1a2c;border-color:var(--red)}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid #25255a}.set:first-child{border-top:0}
.set b{display:block;font-size:15px}.set small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.sw{flex:0 0 auto;width:54px;height:30px;border-radius:15px;border:0;background:#3a3a70;position:relative;padding:0;transition:.2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:#12b87a}.sw.on::after{left:27px}
.set input[type=range]{width:46%;margin:0}
.secbox{display:flex;gap:8px;margin-top:10px}
.secbox input{flex:1;min-width:0;background:#0d0d27;border:1px solid var(--line);border-radius:13px;color:#fff;padding:13px;font-size:16px;-webkit-user-select:text;user-select:text}
.row2{display:flex;gap:8px;margin-top:10px}.row2 .btn{flex:1}
nav button{position:relative}.badge{position:absolute;top:2px;left:54%;min-width:17px;height:17px;border-radius:9px;background:#ff4d6d;color:#fff;font-size:11px;font-style:normal;font-weight:800;line-height:17px;padding:0 4px}
input{-webkit-user-select:text;user-select:text}
#modal{position:absolute;inset:0;background:#000a;z-index:30;display:flex;align-items:flex-end}
#sheet{width:100%;max-height:90%;overflow-y:auto;background:var(--panel);border-radius:22px 22px 0 0;border-top:1px solid var(--line);padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
#sheet.chat{height:88%;display:flex;flex-direction:column}
#chat-msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;padding:10px 0;min-height:0}
#chat-act{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0}
.bub{max-width:82%;padding:9px 12px;border-radius:16px;margin:4px 0;font-size:14px;line-height:1.3;-webkit-user-select:text;user-select:text;word-wrap:break-word}
.bub.me{align-self:flex-end;background:#3b3b90;border-bottom-right-radius:4px}.bub.them{align-self:flex-start;background:#25255a;border-bottom-left-radius:4px}
.bub.sys{align-self:center;background:none;color:var(--mut);font-size:12px;text-align:center;max-width:95%}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 2px #0006}
.pic{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.thumb{width:78px;height:78px;border-radius:16px;background:#0d0d27;display:flex;align-items:center;justify-content:center;font-size:42px;overflow:hidden;flex:0 0 78px}
.thumb.sm{width:52px;height:52px;flex-basis:52px;font-size:28px;border-radius:13px}
.thumb.photo{width:96px;height:96px;flex-basis:96px;border:2px dashed #5b5bb8;font-size:30px;color:var(--mut)}.thumb.photo small{font-size:11px}
.item .ic{overflow:hidden}
.seller{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:4px;min-width:0}.seller span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.priceline{display:flex;justify-content:space-between;align-items:flex-end;margin:12px 2px 4px}.priceline small{color:var(--mut);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.big{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.lead{margin:6px 2px;font-size:13px;color:var(--mut)}.lead.good{color:var(--green);font-weight:800}
.help{border-color:#5b5bb8;background:linear-gradient(160deg,#25255f,#16163a)}
.step{display:flex;gap:10px;align-items:flex-start;margin-top:9px;font-size:14px;line-height:1.3}.step i{flex:0 0 24px;height:24px;border-radius:50%;background:var(--gold);color:#2a1c00;font-style:normal;font-weight:900;text-align:center;line-height:24px}
.dotn{color:var(--red);font-size:18px}
input.full{width:100%;background:#0d0d27;border:1px solid var(--line);border-radius:13px;color:#fff;padding:12px;font-size:16px}
.note{font-size:11px;color:var(--mut);text-align:center;margin:8px 0 2px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div><div class="lbl">SOLDE<span class="fake">ARGENT FICTIF</span></div><div class="bal" id="bal">10,00 €</div></div>
    <div class="hr"><button id="rescue" class="mini hidden">🆘 +5 €</button><button id="snd" class="mini">🔊</button></div>
  </header>
  <main>
    <section id="home" class="screen on"></section>
    <section id="shop" class="screen"></section>
    <section id="stats" class="screen"></section>
    <section id="vtm" class="screen"></section>
    <section id="settings" class="screen"></section>

    <section id="g-plinko" class="screen">
      <div class="gh"><button class="back" data-go="home">‹ Jeux</button><b>🔮 Plinko</b><span class="sp"></span></div>
      <div class="last" id="pl-last"></div>
      <div class="cv"><canvas id="pl-cv"></canvas></div>
      <div class="card">
        <div class="seg" id="pl-risk"><button data-r="low">Faible</button><button data-r="medium">Moyen</button><button data-r="high">Élevé</button></div>
        <div class="balls" id="pl-balls"></div>
        <div class="betbox"><button data-a="half">½</button><button data-a="dn">‹</button><div class="betv"></div><button data-a="up">›</button><button data-a="dbl">2×</button><button data-a="max">MAX</button></div>
        <div class="row"><button class="btn" id="pl-drop">LÂCHER</button><button class="btn ghost" id="pl-x5">×5</button><button class="btn ghost" id="pl-auto">AUTO</button></div>
        <div class="note">Une boule = une mise. Le gain dépend de la case où elle tombe.</div>
      </div>
    </section>

    <section id="g-coin" class="screen">
      <div class="gh"><button class="back" data-go="home">‹ Jeux</button><b>🪙 Pile ou Face</b><span class="sp"></span></div>
      <div class="card">
        <div class="coinwrap"><div id="coinhop"><div id="coin"><div class="face">€<small>PILE</small></div><div class="face b">♠<small>FACE</small></div></div></div></div>
        <div class="msg" id="coin-msg"></div>
        <div class="seg" id="coin-pick"><button data-s="pile">Pile €</button><button data-s="face">Face ♠</button></div>
        <div class="betbox"><button data-a="half">½</button><button data-a="dn">‹</button><div class="betv"></div><button data-a="up">›</button><button data-a="dbl">2×</button><button data-a="max">MAX</button></div>
        <div class="row"><button class="btn" id="coin-go">LANCER · gain x1,96</button></div>
        <div class="note" id="coin-st"></div>
      </div>
    </section>

    <section id="g-dice" class="screen">
      <div class="gh"><button class="back" data-go="home">‹ Jeux</button><b>🎲 Dés</b><span class="sp"></span></div>
      <div class="card">
        <div class="dice-n" id="dice-n">50,00</div>
        <div class="bar" id="dice-bar"><div class="mk" id="dice-mk" style="left:50%"></div></div>
        <div class="msg" id="dice-msg"></div>
        <div class="seg" id="dice-mode"><button data-m="under">Moins que</button><button data-m="over">Plus que</button></div>
        <input type="range" id="dice-t" min="2" max="98" step="1">
        <div class="stats3"><div>CIBLE<b id="dice-tv"></b></div><div>CHANCE<b id="dice-ch"></b></div><div>GAIN<b id="dice-mu"></b></div></div>
        <div class="betbox"><button data-a="half">½</button><button data-a="dn">‹</button><div class="betv"></div><button data-a="up">›</button><button data-a="dbl">2×</button><button data-a="max">MAX</button></div>
        <div class="row"><button class="btn" id="dice-go">LANCER LES DÉS</button></div>
      </div>
    </section>

    <section id="g-slots" class="screen">
      <div class="gh"><button class="back" data-go="home">‹ Jeux</button><b>🎰 Machine à sous</b><span class="sp"></span></div>
      <div class="card">
        <div class="reels"><div class="reel" id="r0">🍒</div><div class="reel" id="r1">🍋</div><div class="reel" id="r2">🔔</div></div>
        <div class="msg" id="slot-msg"></div>
        <div class="pt" id="slot-pt"></div>
        <div class="betbox"><button data-a="half">½</button><button data-a="dn">‹</button><div class="betv"></div><button data-a="up">›</button><button data-a="dbl">2×</button><button data-a="max">MAX</button></div>
        <div class="row"><button class="btn" id="slot-go">TOURNER</button></div>
      </div>
    </section>

    <section id="g-mines" class="screen">
      <div class="gh"><button class="back" data-go="home">‹ Jeux</button><b>💣 Mines</b><span class="sp"></span></div>
      <div class="mi"><div>MULTIPLICATEUR<b id="mn-mult">1x</b></div><div>PROCHAIN<b id="mn-next">—</b></div></div>
      <div class="mgrid" id="mn-grid"></div>
      <div class="msg" id="mn-msg"></div>
      <div class="card">
        <div id="mn-setup">
          <div class="lbl" style="margin-bottom:6px">NOMBRE DE MINES</div>
          <div class="seg" id="mn-count"><button data-n="1">1</button><button data-n="3">3</button><button data-n="5">5</button><button data-n="10">10</button><button data-n="20">20</button></div>
          <div class="betbox" id="mn-bet"><button data-a="half">½</button><button data-a="dn">‹</button><div class="betv"></div><button data-a="up">›</button><button data-a="dbl">2×</button><button data-a="max">MAX</button></div>
          <div class="row"><button class="btn" id="mn-start">COMMENCER</button></div>
        </div>
        <div id="mn-play" class="hidden">
          <div class="muted" id="mn-cur" style="text-align:center;margin-bottom:8px"></div>
          <button class="btn green" id="mn-cash">ENCAISSER</button>
        </div>
      </div>
    </section>
  </main>
  <nav>
    <button data-go="home" class="on"><span>🎮</span>Jeux</button>
    <button data-go="shop"><span>🛒</span>Boutique</button>
    <button data-go="vtm"><span>🏷️</span>VTM<i class="badge hidden" id="vtm-badge">0</i></button>
    <button data-go="stats"><span>📊</span>Gains</button>
    <button data-go="settings"><span>⚙️</span>Réglages</button>
  </nav>
  <div id="toast"></div>
  <div id="modal" class="hidden"><div id="sheet"></div></div>
</div>

<script>
'use strict';
/* ================= outils & état ================= */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const r2=x=>Math.round(x*100)/100;
const EUR=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'});
const fmt=n=>EUR.format(n);
const fx=m=>String(m>=100?Math.round(m):Math.round(m*100)/100).replace('.',',')+'x';
const clone=o=>JSON.parse(JSON.stringify(o));
const KEY='casinoFictif1';
const DEF={bal:10,deposited:10,spent:0,wagered:0,won:0,best:{net:0,amt:0,mult:0,game:''},
  plays:{plinko:0,coin:0,dice:0,slots:0,mines:0},owned:{balls:['classic'],games:['plinko','coin'],ups:[]},
  ball:'classic',risk:'medium',bet:1,hist:[],series:[10],lastDaily:0,sound:true,mn:null,
  vol:1,toasts:true,inv:[],cust:{},vtm:null,vtmHelp:true,aiKey:'',aiModel:'claude-haiku-5-5',aiOn:true,coinSide:'pile',diceMode:'under',diceT:50,minesN:3,rescues:0};
let S;
try{S=Object.assign(clone(DEF),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=clone(DEF)}
S.owned=Object.assign(clone(DEF.owned),S.owned);S.plays=Object.assign(clone(DEF.plays),S.plays);
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const GAMES=[
 {id:'plinko',name:'Plinko',em:'🔮',desc:'Lâche les boules et vise les gros multiplicateurs',price:0},
 {id:'coin',name:'Pile ou Face',em:'🪙',desc:'Un tirage, x1,96 si tu as vu juste',price:0},
 {id:'dice',name:'Dés',em:'🎲',desc:'Choisis ta chance, ton gain s\'adapte',price:15},
 {id:'slots',name:'Machine à sous',em:'🎰',desc:'3 rouleaux, jusqu\'à x500',price:40},
 {id:'mines',name:'Mines',em:'💣',desc:'Évite les bombes, encaisse au bon moment',price:75}];
const BALLS=[
 {id:'classic',name:'Classique',price:0,color:'#4cc9ff',desc:'La bonne vieille boule.'},
 {id:'gold',name:'Boule dorée',price:25,color:'#ffd24a',bonus:1.06,desc:'+6 % sur tous les gains.'},
 {id:'clover',name:'Trèfle chanceux',price:60,color:'#2ee59d',lucky:0.08,desc:'8 % de chances de doubler le gain.'},
 {id:'diamond',name:'Diamant',price:150,color:'#b9f3ff',bonus:1.12,desc:'+12 % sur tous les gains.'},
 {id:'rainbow',name:'Arc-en-ciel',price:400,color:'rainbow',bonus:1.12,floor:0.5,desc:'+12 % et ne rend jamais moins de la moitié de la mise.'}];
const UPS=[
 {id:'auto',name:'Lâcher automatique',em:'🔁',price:40,desc:'Plinko : une boule toute seule toutes les 0,5 s.'},
 {id:'multi',name:'Boules ×5',em:'✋',price:60,desc:'Plinko : lâche 5 boules d\'un coup.'},
 {id:'daily',name:'Gros coffre quotidien',em:'🎁',price:100,desc:'Bonus quotidien de 25 € au lieu de 10 €.'}];
const BALL_BY=Object.fromEntries(BALLS.map(b=>[b.id,b]));
const balls=[];
let hold=0,pending=0,shown=S.bal,anim=0,cur='home',autoOn=false;

/* ================= audio ================= */
let AC=null,lastBeep=0;
function beep(f,d,type,v){
  if(!S.sound)return;const now=performance.now();if(now-lastBeep<28&&d<0.06)return;lastBeep=now;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    v=(v||0.05)*(S.vol==null?1:S.vol);d=d||0.08;o.type=type||'sine';o.frequency.value=f;o.connect(g);g.connect(AC.destination);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.start(t);o.stop(t+d+0.02)}catch(e){}
}
function jingle(big){const n=big?[523,659,784,1047,1319]:[523,659,784];n.forEach((f,i)=>setTimeout(()=>beep(f,0.14,'triangle',0.07),i*90))}

/* ================= interface commune ================= */
let tt;
function toast(m,k){const e=$('#toast');e.textContent=m;e.className='show '+(k||'');clearTimeout(tt);tt=setTimeout(()=>e.className='',2000)}
function activeBalls(){return balls.filter(b=>b.land===undefined).length}
function needsRescue(){return S.bal<0.1&&activeBalls()===0&&!S.mn&&pending===0}
function updateBal(){
  $('#rescue').classList.toggle('hidden',!needsRescue());
  if(hold>0)return;
  const el=$('#bal'),from=shown,to=S.bal,t0=performance.now();cancelAnimationFrame(anim);
  if(Math.abs(to-from)<0.005){shown=to;el.textContent=fmt(to);return}
  el.classList.remove('up','down');void el.offsetWidth;el.classList.add(to>from?'up':'down');
  const tick=t=>{const k=Math.min(1,(t-t0)/450);shown=from+(to-from)*k;el.textContent=fmt(shown);if(k<1)anim=requestAnimationFrame(tick);else shown=to};
  anim=requestAnimationFrame(tick);
}
function noMoney(){toast('Pas assez d\'argent !','bad');beep(160,0.2,'sawtooth');return false}
function takeBet(g,a){S.bal=r2(S.bal-a);S.wagered=r2(S.wagered+a);S.plays[g]++;updateBal()}
function settle(g,bet,amt){
  S.bal=r2(S.bal+amt);S.won=r2(S.won+amt);const net=r2(amt-bet);
  S.hist.unshift({g,bet,amt});if(S.hist.length>30)S.hist.length=30;
  if(net>S.best.net)S.best={net,amt,mult:bet?amt/bet:0,game:g};
  S.series.push(S.bal);if(S.series.length>160)S.series.shift();
  save();updateBal();
}
function winFx(m,amt){if(m>=5){jingle(true);if(S.toasts!==false)toast('🎉 '+fx(m)+' → '+fmt(amt),'good')}else if(m>=1){jingle(false)}else beep(200,0.18,'triangle')}
function go(id){
  if(cur==='g-plinko'&&id!=='g-plinko'&&autoOn){autoOn=false}
  cur=id;$$('.screen').forEach(s=>s.classList.toggle('on',s.id===id));
  const tab=(id==='shop'||id==='stats'||id==='settings'||id==='vtm')?id:'home';$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===tab));
  $('#'+id).scrollTop=0;
  if(id==='home')renderHome();if(id==='shop')renderShop();if(id==='stats')renderStats();if(id==='settings')renderSettings();if(id==='vtm')renderVtm();
  if(id==='g-plinko')renderPlinkoUI();if(id==='g-coin')renderCoinUI();if(id==='g-dice')renderDiceUI();
  if(id==='g-slots')renderSlotsUI();if(id==='g-mines')renderMinesUI();
  renderBets();
}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){beep(520,0.04);go(g.dataset.go)}});
window.__back=function(){if(modalCtx){closeModal();return true}if(cur!=='home'){go('home');return true}return false};

/* ================= mises ================= */
const STEPS=[0.1,0.2,0.5,1,2,5,10,20,50,100,200,500,1000,2000,5000,10000];
function setBet(v){S.bet=r2(Math.max(0.1,v));save();renderBets()}
function renderBets(){$$('.betv').forEach(e=>e.textContent=fmt(S.bet));const d=$('#pl-drop');if(d)d.textContent='LÂCHER · '+fmt(S.bet)}
document.addEventListener('click',e=>{
  const b=e.target.closest('.betbox button');if(!b)return;const a=b.dataset.a;
  if(a==='half')setBet(S.bet/2);else if(a==='dbl')setBet(S.bet*2);else if(a==='max')setBet(Math.floor(S.bal*100)/100);
  else if(a==='up'){const n=STEPS.find(x=>x>S.bet+1e-9);if(n)setBet(n)}
  else{const p=[...STEPS].reverse().find(x=>x<S.bet-1e-9);if(p)setBet(p)}
  beep(600,0.03);
});

/* ================= bonus, secours, son ================= */
$('#rescue').onclick=()=>{S.bal=r2(S.bal+5);S.deposited=r2(S.deposited+5);S.rescues++;save();updateBal();toast('+5 € de secours 🆘','good');jingle(false)};
$('#snd').onclick=()=>{setSound(!S.sound);if(cur==='settings')renderSettings()};
function dailyValue(){return S.owned.ups.includes('daily')?25:10}
function claimDaily(){if(Date.now()-S.lastDaily<864e5)return;const v=dailyValue();S.bal=r2(S.bal+v);S.deposited=r2(S.deposited+v);S.lastDaily=Date.now();save();updateBal();toast('🎁 +'+fmt(v)+' !','good');jingle(true);renderHome()}

/* ================= PLINKO ================= */
//#PHYS-START
const PW=360,PH=400,COLS=13,SX=PW/COLS,ROWS=10,SY=28.5,Y0=62,SLOT_Y=338,BR=6.5,PR=3.2,G=1600,REST=0.55,NOISE=0.5,STEP=1/120;
const pegs=[];
for(let i=0;i<ROWS;i++){const n=i+3;for(let j=0;j<n;j++)pegs.push({x:PW/2+(j-(n-1)/2)*SX,y:Y0+i*SY,f:0})}
let hitCount=0;
function stepBall(b,dt){
  if(b.land!==undefined){
    b.land+=dt;const cx=(b.slot+0.5)*SX;b.x+=(cx-b.x)*Math.min(1,dt*18);b.vy+=G*dt;b.y=Math.min(b.y+b.vy*dt*0.5,PH-30);
    if(b.land>0.4)b.dead=true;return;
  }
  b.t=(b.t||0)+dt;
  b.vy+=G*dt;b.vx*=Math.max(0,1-8*dt);b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.x<BR){b.x=BR;b.vx=Math.abs(b.vx)*0.5}else if(b.x>PW-BR){b.x=PW-BR;b.vx=-Math.abs(b.vx)*0.5}
  const m=BR+PR;
  for(let k=0;k<pegs.length;k++){
    const p=pegs[k];if(Math.abs(p.y-b.y)>m)continue;
    const dx=b.x-p.x,dy=b.y-p.y,d2=dx*dx+dy*dy;if(d2>=m*m)continue;
    const d=Math.sqrt(d2)||0.001,nx=dx/d,ny=dy/d;b.x=p.x+nx*m;b.y=p.y+ny*m;
    const a=(Math.random()-0.5)*NOISE,c=Math.cos(a),s=Math.sin(a),rx=nx*c-ny*s,ry=nx*s+ny*c;
    const vn=b.vx*rx+b.vy*ry;
    if(vn<0){b.vx-=(1+REST)*vn*rx;b.vy-=(1+REST)*vn*ry;p.f=1;hitCount++}
  }
  if(b.y>=SLOT_Y||b.t>20){b.slot=Math.max(0,Math.min(COLS-1,Math.floor(b.x/SX)));b.land=0}
}
//#PHYS-END
const mirror=a=>a.concat(a.slice(0,-1).reverse());
const MULTS={
  low:mirror([10,3,1.6,1.4,1.1,1,0.4]),
  medium:mirror([30,9,5,3,0.7,0.5,0.2]),
  high:mirror([110,12,6,2.5,0.7,0.2,0.2])};
const slotFlash=new Array(COLS).fill(0),floats=[],lastRes=[];
const cv=$('#pl-cv'),cx=cv.getContext('2d');cv.width=PW*2;cv.height=PH*2;cx.scale(2,2);
function colForMult(m){return m<1?'#7a2a47':m<1.5?'#8f5a2c':m<3?'#a98a2a':m<10?'#25906a':'#7b4de0'}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function ballFill(c,b,t,x,y,r){
  const col=b.type.color==='rainbow'?`hsl(${(t/8+b.hue)%360},90%,60%)`:b.type.color;
  const g=c.createRadialGradient(x-r*.35,y-r*.4,1,x,y,r);g.addColorStop(0,'#fff');g.addColorStop(.35,col);g.addColorStop(1,col);
  c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill();
}
function drawPlinko(dt,t){
  const c=cx,mults=MULTS[S.risk];
  const bg=c.createLinearGradient(0,0,0,PH);bg.addColorStop(0,'#16163f');bg.addColorStop(1,'#0a0a22');c.fillStyle=bg;c.fillRect(0,0,PW,PH);
  c.fillStyle='#ffd24a';c.beginPath();c.moveTo(PW/2-9,4);c.lineTo(PW/2+9,4);c.lineTo(PW/2,17);c.fill();
  for(let i=0;i<COLS;i++){
    const x=i*SX,m=mults[i],f=slotFlash[i];
    c.fillStyle=colForMult(m);rr(c,x+1.5,350,SX-3,36,6);c.fill();
    if(f>0){c.fillStyle='rgba(255,255,255,'+(f*.65)+')';rr(c,x+1.5,350,SX-3,36,6);c.fill();slotFlash[i]=Math.max(0,f-dt*2.2)}
    c.fillStyle='#fff';c.font='bold '+(m>=100?9:10)+'px system-ui';c.textAlign='center';c.textBaseline='middle';c.fillText(fx(m),x+SX/2,368);
  }
  for(const p of pegs){
    c.fillStyle='#e8ecff';c.beginPath();c.arc(p.x,p.y,PR,0,7);c.fill();
    if(p.f>0){c.fillStyle='rgba(255,226,120,'+p.f+')';c.beginPath();c.arc(p.x,p.y,PR+4*p.f,0,7);c.fill();p.f=Math.max(0,p.f-dt*4)}
  }
  for(const b of balls){const al=b.land!==undefined?Math.max(0,1-b.land/0.4):1;c.globalAlpha=al;ballFill(c,b,t,b.x,b.y,BR);c.globalAlpha=1}
  for(let i=floats.length-1;i>=0;i--){
    const f=floats[i];f.t+=dt;if(f.t>1.2){floats.splice(i,1);continue}
    c.globalAlpha=Math.min(1,(1.2-f.t)*2);c.fillStyle=f.col;c.font='bold 14px system-ui';c.textAlign='center';c.fillText(f.txt,Math.max(30,Math.min(PW-30,f.x)),342-f.t*40);c.globalAlpha=1;
  }
}
function dropBall(){
  const bet=S.bet;
  if(S.bal+1e-9<bet)return noMoney();
  if(activeBalls()>=40){toast('Déjà beaucoup de boules en l\'air !');return false}
  takeBet('plinko',bet);
  balls.push({x:PW/2+(Math.random()-.5)*10,y:18,vx:(Math.random()-.5)*30,vy:0,bet,type:BALL_BY[S.ball]||BALLS[0],mults:MULTS[S.risk],hue:Math.random()*360});
  beep(700,0.04);return true;
}
function onLand(b,silent){
  const t=b.type;let amt=b.bet*b.mults[b.slot],lucky=false;
  if(t.bonus)amt*=t.bonus;
  if(t.floor)amt=Math.max(amt,b.bet*t.floor);
  if(t.lucky&&Math.random()<t.lucky){amt*=2;lucky=true}
  amt=r2(amt);settle('plinko',b.bet,amt);
  const m=amt/b.bet;
  lastRes.unshift({m,w:amt>=b.bet});if(lastRes.length>8)lastRes.length=8;
  if(!silent){
    slotFlash[b.slot]=1;floats.push({x:(b.slot+.5)*SX,t:0,txt:(lucky?'🍀 ':'')+fmt(amt),col:amt>=b.bet?'#7dffcb':'#ff9db1'});
    winFx(m,amt);if(cur==='g-plinko')renderLast();
  }
}
function renderLast(){$('#pl-last').innerHTML=lastRes.map(r=>`<span class="chip ${r.w?'w':'l'}">${fx(Math.round(r.m*100)/100)}</span>`).join('')}
function ballCss(b){return b.color==='rainbow'?'background:conic-gradient(#f44,#fa0,#ee0,#4d4,#0dd,#44f,#d4d,#f44)':`background:radial-gradient(circle at 35% 30%,#fff9,${b.color} 60%)`}
function renderPlinkoUI(){
  $$('#pl-risk button').forEach(b=>b.classList.toggle('on',b.dataset.r===S.risk));
  const cb=BALL_BY[S.ball]||BALLS[0];
  $('#pl-balls').innerHTML=BALLS.filter(b=>S.owned.balls.includes(b.id)).map(b=>`<button class="bc ${S.ball===b.id?'on':''}" data-ball="${b.id}"><i style="${ballCss(b)}"></i></button>`).join('')+`<span class="bn"><b>${cb.name}</b> — ${cb.desc}</span>`;
  const has=u=>S.owned.ups.includes(u);
  $('#pl-auto').textContent=has('auto')?(autoOn?'STOP':'AUTO'):'🔒 AUTO';$('#pl-auto').classList.toggle('on',autoOn);
  $('#pl-x5').textContent=has('multi')?'×5':'🔒 ×5';
  renderLast();renderBets();
}
$('#pl-risk').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.risk=b.dataset.r;save();renderPlinkoUI();beep(520,0.04)};
$('#pl-balls').onclick=e=>{const b=e.target.closest('[data-ball]');if(!b)return;S.ball=b.dataset.ball;save();renderPlinkoUI();beep(520,0.04)};
$('#pl-drop').onclick=()=>dropBall();
$('#pl-x5').onclick=()=>{
  if(!S.owned.ups.includes('multi')){toast('Débloque « Boules ×5 » dans la boutique 🛒');return}
  if(S.bal+1e-9<S.bet*5)return noMoney();
  for(let i=0;i<5;i++)setTimeout(dropBall,i*140);
};
let autoT=0;
$('#pl-auto').onclick=()=>{
  if(!S.owned.ups.includes('auto')){toast('Débloque « Lâcher automatique » dans la boutique 🛒');return}
  autoOn=!autoOn;renderPlinkoUI();
};
function flush(){
  for(const b of balls){let n=0;while(b.land===undefined&&n++<6000)stepBall(b,STEP);if(!b.counted){b.counted=true;onLand(b,true)}}
  balls.length=0;save();hold=0;updateBal();
}
window.__flush=flush;
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
window.addEventListener('pagehide',flush);
let lastT=performance.now(),acc=0,lastHit=0;
function frame(t){
  const dt=Math.min((t-lastT)/1000,0.05);lastT=t;acc+=dt;
  while(acc>=STEP){for(const b of balls)stepBall(b,STEP);acc-=STEP}
  for(let i=balls.length-1;i>=0;i--){const b=balls[i];
    if(b.land===0&&!b.counted){b.counted=true;onLand(b)}
    if(b.dead)balls.splice(i,1)}
  if(hitCount!==lastHit){lastHit=hitCount;if(cur==='g-plinko')beep(380+Math.random()*260,0.03,'sine',0.025)}
  if(autoOn){autoT+=dt;if(autoT>=0.5){autoT=0;if(!dropBall()){autoOn=false;renderPlinkoUI()}}}
  if(cur==='g-plinko')drawPlinko(dt,t);
  if(!hold&&balls.length===0&&$('#rescue').classList.contains('hidden')===needsRescue())updateBal();
  requestAnimationFrame(frame);
}

/* ================= PILE OU FACE ================= */
let coinBusy=false,coinRot=0,streak=0;
function renderCoinUI(){$$('#coin-pick button').forEach(b=>b.classList.toggle('on',b.dataset.s===S.coinSide));$('#coin-st').textContent=streak>1?('🔥 Série : '+streak):'';renderBets()}
$('#coin-pick').onclick=e=>{const b=e.target.closest('button');if(!b||coinBusy)return;S.coinSide=b.dataset.s;save();renderCoinUI();beep(520,0.04)};
$('#coin-go').onclick=()=>{
  if(coinBusy)return;const bet=S.bet;if(S.bal+1e-9<bet)return noMoney();
  coinBusy=true;pending++;takeBet('coin',bet);hold++;
  const res=Math.random()<0.5?'pile':'face',win=res===S.coinSide,amt=win?r2(bet*1.96):0;settle('coin',bet,amt);
  coinRot=(Math.floor(coinRot/360)+1)*360+1440+(res==='pile'?0:180);
  $('#coin').style.transform=`rotateY(${coinRot}deg)`;
  const h=$('#coinhop');h.classList.remove('hop');void h.offsetWidth;h.classList.add('hop');
  $('#coin-msg').textContent='';$('#coin-msg').className='msg';beep(300,0.12);
  setTimeout(()=>{
    hold--;pending--;coinBusy=false;updateBal();streak=win?streak+1:0;
    const m=$('#coin-msg');m.className='msg '+(win?'w':'l');m.textContent=win?('C\'est '+(res==='pile'?'PILE':'FACE')+' ! +'+fmt(amt)):('C\'était '+(res==='pile'?'PILE':'FACE')+'… perdu');
    win?winFx(1.96,amt):beep(180,0.25,'sawtooth');renderCoinUI();
  },1300);
};

/* ================= DÉS ================= */
let diceBusy=false;
const diceChance=()=>S.diceMode==='under'?S.diceT:100-S.diceT;
const diceMult=()=>Math.floor(97/diceChance()*10000)/10000;
function renderDiceUI(){
  $$('#dice-mode button').forEach(b=>b.classList.toggle('on',b.dataset.m===S.diceMode));
  $('#dice-t').value=S.diceT;$('#dice-tv').textContent=S.diceT;$('#dice-ch').textContent=diceChance()+' %';$('#dice-mu').textContent=fx(diceMult());
  const t=S.diceT;$('#dice-bar').style.background=S.diceMode==='under'?`linear-gradient(90deg,#1f9d70 ${t}%,#a02a46 ${t}%)`:`linear-gradient(90deg,#a02a46 ${t}%,#1f9d70 ${t}%)`;
  renderBets();
}
$('#dice-mode').onclick=e=>{const b=e.target.closest('button');if(!b||diceBusy)return;S.diceMode=b.dataset.m;save();renderDiceUI()};
$('#dice-t').oninput=e=>{if(diceBusy)return;S.diceT=+e.target.value;save();renderDiceUI()};
$('#dice-go').onclick=()=>{
  if(diceBusy)return;const bet=S.bet;if(S.bal+1e-9<bet)return noMoney();
  diceBusy=true;pending++;takeBet('dice',bet);hold++;
  const roll=Math.floor(Math.random()*10000)/100,win=S.diceMode==='under'?roll<S.diceT:roll>S.diceT,mu=diceMult(),amt=win?r2(bet*mu):0;
  settle('dice',bet,amt);$('#dice-msg').textContent='';$('#dice-msg').className='msg';
  let n=0;const iv=setInterval(()=>{$('#dice-n').textContent=(Math.random()*100).toFixed(2).replace('.',',');$('#dice-mk').style.left=(Math.random()*100)+'%';beep(300+Math.random()*300,0.03,'square',0.02);if(++n>=14){

  if(!S.cust)S.cust={};Object.values(S.cust).forEach(regCust);
  S.vtm.mine.forEach(m=>m.chats.forEach(c=>c.busy=false));S.vtm.auc.forEach(a=>{if(a.chat)a.chat.busy=false});
  while(S.vtm.auc.length<6)newAuction(true);
}

/* ---------- enchères ---------- */
function newAuction(initial){
  const V=S.vtm,now=Date.now();
  const pool=Object.values(ITEMS).filter(i=>i.rar>=1).flatMap(i=>Array(i.rar===3?2:3).fill(i));
  const it=pick(pool),v=itemVal(it.id)*rnd(.92,1.08);
  const start=money(v*rnd(.12,.3));
  const a={id:V.uid++,item:it.id,seller:pick(SELLERS),val:v,max:v*rnd(.75,1.35),end:now+(initial?rnd(40,600):rnd(150,720))*1000,
    next:now+rnd(8,40)*1000,bid:0,bidder:null,myHold:0,ext:0,start,price:start,chat:null};
  a.buy=Math.max(money(v*1.55),money(start*1.5));
  const n=ri(0,5);for(let k=0;k<n;k++){const inc=incOf(a.price);if(a.price+inc>a.max*.8)break;a.price=r2(a.price+inc);a.bidder=pick(NAMES);a.bid++}
  V.auc.push(a);return a;
}
const minBid=a=>a.bidder?r2(a.price+incOf(a.price)):a.price;
function botStep(a,t){
  const inc=incOf(a.price);let bid=false;
  if(a.bidder==='me'){
    if(a.price+inc<=a.max&&Math.random()<.85){
      let np=r2(a.price+inc*ri(1,2));if(np>a.max)np=r2(a.price+inc);
      a.price=np;a.bidder=pick(NAMES);a.bid++;bid=true;
      S.bal=r2(S.bal+a.myHold);a.myHold=0;updateBal();
      vlog('📉 Surenchéri sur '+ITEMS[a.item].name);toast('📉 Surenchéri : '+ITEMS[a.item].name,'bad');beep(200,.15,'triangle',.06);
    }
  }else if(Math.random()<.4&&a.price+inc<=a.max*.9){a.price=r2(a.price+inc);a.bidder=pick(NAMES);a.bid++;bid=true}
  if(bid&&a.end-t<20000&&a.ext<5){a.end+=20000;a.ext++}
  a.next=t+rnd(8,50)*1000;
}
function finishAuction(a){
  const V=S.vtm,it=ITEMS[a.item];V.auc=V.auc.filter(x=>x!==a);
  if(a.bidder==='me'){
    S.inv.push({uid:V.uid++,id:a.item,paid:a.price});V.bought++;
    vlog('🏆 Remportée : '+it.name+' à '+fmt(a.price));toast('🏆 Enchère gagnée : '+it.name+' !','good');jingle(true);
  }else if(a.bidder)vlog(it.name+' vendu à '+a.bidder+' ('+fmt(a.price)+')');
}
function simAuc(now){
  const V=S.vtm;let ch=false;
  for(const a of [...V.auc]){
    let g=0;while(g++<60&&a.next<=Math.min(now,a.end)){botStep(a,a.next);ch=true}
    if(now>=a.end){finishAuction(a);ch=true}
  }
  if(V.auc.length<6&&(V.auc.length<4||now>=V.nextAuc)){newAuction();V.nextAuc=now+rnd(8,30)*1000;ch=true}
  return ch;
}
function placeBid(a,amt){
  if(!S.vtm.auc.includes(a)){toast('Enchère terminée','bad');return}
  if(a.bidder==='me'){toast('Tu es déjà en tête 👍');return}
  amt=r2(amt);if(!(amt>=minBid(a))){toast('Mise minimum : '+fmt(minBid(a)),'bad');beep(160,.2,'sawtooth');return}
  if(S.bal+1e-9<amt){noMoney();return}
  S.bal=r2(S.bal-amt);a.myHold=amt;a.price=amt;a.bidder='me';a.bid++;
  if(a.end-Date.now()<20000&&a.ext<5){a.end+=20000;a.ext++}
  a.next=Date.now()+rnd(5,20)*1000;
  save();updateBal();beep(620,.08,'triangle',.07);toast('Enchère placée : '+fmt(amt),'good');
  if(cur==='vtm')renderVtm();if(modalCtx&&modalCtx.kind==='aucd')renderAucModal();
}
function buyNow(a,p){
  if(!S.vtm.auc.includes(a)){toast('Enchère terminée','bad');return false}
  const refund=a.bidder==='me'?a.myHold:0;
  if(S.bal+refund+1e-9<p){noMoney();return false}
  S.bal=r2(S.bal+refund-p);a.myHold=0;
  S.inv.push({uid:S.vtm.uid++,id:a.item,paid:p});S.vtm.bought++;S.vtm.auc=S.vtm.auc.filter(x=>x!==a);
  vlog('🛒 Acheté : '+ITEMS[a.item].name+' à '+fmt(p));save();updateBal();toast('🛒 Acheté : '+ITEMS[a.item].name,'good');jingle(true);
  return true;
}

/* ---------- acheteurs (IA de négociation) ---------- */
const BT={
 radin:{ok:p=>`Bon… OK, ${fmt(p)}. Marché conclu.`,ctr:c=>`Hmm… allez, je monte à ${fmt(c)}, pas un centime de plus.`,no:'Même pas en rêve, c\'est trop cher.',leave:'Laisse tomber, j\'achète ailleurs.'},
 presse:{ok:p=>`Top, parfait ! Vendu à ${fmt(p)} 👍`,ctr:c=>`Je peux faire ${fmt(c)}, mais je dois vraiment y aller.`,no:'Trop cher pour moi, désolé.',leave:'Je pars, bonne continuation.'},
 sympa:{ok:p=>`Super, merci beaucoup ! 😊 ${fmt(p)}, c'est parfait.`,ctr:c=>`Je peux faire un petit effort : ${fmt(c)} ?`,no:'Oh, c\'est un peu au-dessus de mon budget… 😕',leave:'Pas de souci, merci quand même ! Bonne journée 🙂'},
 collec:{ok:p=>`Excellent. ${fmt(p)}, c'est un plaisir de traiter avec vous.`,ctr:c=>`Je peux monter à ${fmt(c)}, c'est déjà généreux.`,no:'Ce prix ne reflète pas la cote réelle.',leave:'Dans ce cas, je passe mon chemin.'}
};
const OPEN_T={
 radin:['Salut. {it} à {ask}, c\'est abusé. Je te donne {o} cash.','Yo, {o} pour {it} et on n\'en parle plus.','Bonjour, vu l\'état probable, je dirais {o} max.'],
 presse:['Bonjour ! Je prends {it} tout de suite à {o} si tu valides.','Hello, je suis pressé : {o} et je le prends dans l\'heure ?'],
 sympa:['Bonjour ! 😊 {it} est toujours disponible ? Je te propose {o}, si ça te va.','Coucou ! Il me plaît beaucoup, {o}, ça t\'irait ?'],
 collec:['Bonsoir. Je collectionne ce genre de pièce. {it} est-il en bon état ? Je peux proposer {o}.','Bonjour, belle pièce. Je vous en offre {o}, je suis un vrai passionné.'],
 arnaq:['Bonjour ! Je prends {it} au prix, {o}. Je paie par virement hors VTM : envoie d\'abord l\'objet et je vire direct 👍','Salut, je veux ton {it} à {o}. Je ne passe pas par la plateforme : envoie-le moi, je te paie après réception !']
};
function pushMsg(ch,from,text){ch.msgs.push({from,text,t:Date.now()})}
function spawnBuyer(m,t){
  const it=ITEMS[m.id],v=itemVal(m.id);
  const roll=Math.random()*100;let per;
  if(m.price>=15&&roll<8)per='arnaq';
  else{const w=[['radin',30],['presse',20],['sympa',30],['collec',it.rar>=1?25:5]],tot=w.reduce((s,x)=>s+x[1],0);let r=Math.random()*tot;per='sympa';for(const [k,x] of w){if((r-=x)<0){per=k;break}}}
  const mx={radin:rnd(.6,.85),presse:rnd(.95,1.15),sympa:rnd(.85,1.02),collec:rnd(1,1.3)}[per];
  const max=per==='arnaq'?1e9:v*mx;
  const k={radin:rnd(.4,.6),presse:rnd(.88,.98),sympa:rnd(.75,.9),collec:rnd(.85,1),arnaq:1}[per];
  const o=money(Math.min(m.price*k,max));
  const ch={id:S.vtm.uid++,buyer:pick(NAMES),per,max,lastOffer:o,rounds:0,patience:3,state:'open',unread:true,busy:false,msgs:[]};
  const text=pick(OPEN_T[per]).replace('{it}',it.name).replace('{ask}',fmt(m.price)).replace('{o}',fmt(o));
  ch.msgs.push({from:'them',text,t});m.chats.push(ch);return ch;
}
function buyerGap(m){const r=m.price/itemVal(m.id),rep=1+Math.min(.5,S.vtm.sold*.03);return rnd(.5,1.5)*(r<=.8?40:r<=1?90:r<=1.2?200:r<=1.5?480:1100)/rep*1000}
function simBuyers(now){
  let n=0;
  for(const m of S.vtm.mine){
    if(!m.next)m.next=now+buyerGap(m);
    let g=0;while(m.next<=now&&g++<15){
      if(m.chats.filter(c=>c.state==='open').length<3){spawnBuyer(m,m.next);n++}
      m.next+=buyerGap(m);
    }
    m.chats.forEach(c=>{if(c.state==='open'&&!c.busy&&now-c.msgs[c.msgs.length-1].t>72e5){c.state='left';pushMsg(c,'sys','Le client a perdu patience.')}});
  }
  return n;
}
const parseNum=t=>{const m=t.replace(',','.').match(/(\d+(?:\.\d+)?)/);return m?parseFloat(m[1]):null};
const hasAny=(t,l)=>l.some(w=>t.includes(w));
const isOk=t=>/(^|[^a-zà-ÿ])ok([^a-zà-ÿ]|$)/.test(t)||hasAny(t,['d\'accord','d accord','marché conclu','marche conclu','vendu','ça marche','ca marche','deal','j\'accepte','accepte']);
function refreshUI(){
  updateBadge();
  if(modalCtx&&modalCtx.chat)renderChat();
  if(cur==='vtm'&&!modalCtx)renderVtm();
}
function npcSay(ctx,text,after,ai){
  const ch=ctx.chat;ch.busy=true;renderChat();
  const deliver=t=>{ch.busy=false;pushMsg(ch,'them',t||text);if(after)after();save();refreshUI()};
  if(ai&&aiOn())aiText(ctx,ai).then(deliver,()=>{if(!aiWarned){aiWarned=true;toast('IA indisponible : mode local','bad')}deliver(null)});
  else setTimeout(()=>deliver(null),rnd(700,1400));
}
function removeListing(m){S.vtm.mine=S.vtm.mine.filter(x=>x!==m)}
function doSale(m,ch,price){
  const net=r2(price*.95);S.bal=r2(S.bal+net);dropItem(m.uid);removeListing(m);
  S.vtm.sold++;S.vtm.earned=r2(S.vtm.earned+net);ch.state='sold';
  pushMsg(ch,'sys','✅ Vendu '+fmt(price)+' · commission 5 % · tu reçois '+fmt(net));
  vlog('💰 Vendu : '+ITEMS[m.id].name+' à '+fmt(price)+' (net '+fmt(net)+')');
  save();updateBal();toast('💰 Vendu ! +'+fmt(net),'good');jingle(true);
}
function sellAction(ctx,kind,txt,p){
  const m=ctx.m,ch=ctx.chat;if(ch.state!=='open'||ch.busy)return;
  if(txt)pushMsg(ch,'me',txt);
  const P=ch.per;
  if(P==='arnaq'){
    if(kind==='accept'||(kind==='text'&&isOk((txt||'').toLowerCase()))){
      npcSay(ctx,'Parfait ! Envoie-le moi, je te vire ça demain 😉',()=>{
        ch.state='scam';pushMsg(ch,'sys','🕵️ Il a disparu avec ton objet… c\'était une arnaque.');
        dropItem(m.uid);removeListing(m);vlog('🕵️ Arnaque : '+ITEMS[m.id].name+' perdu');
        toast('🕵️ Tu t\'es fait arnaquer !','bad');beep(140,.4,'sawtooth')},{o:'scamok'});
      return;
    }
    if(kind==='refuse'){ch.state='left';npcSay(ctx,'Pff, tant pis.',()=>pushMsg(ch,'sys','Le client est parti.'),{o:'leave'});return}
    ch.patience--;
    if(ch.patience<=0){ch.state='left';npcSay(ctx,'Bon, je vais voir ailleurs.',()=>pushMsg(ch,'sys','Le client est parti.'),{o:'leave'})}
    else npcSay(ctx,pick(['Fais-moi confiance, envoie d\'abord, je te vire dès réception.','Pas besoin de la plateforme, ça évite les frais. Envoie d\'abord !']),null,{o:'scam'});
    return;
  }
  const T=BT[P];
  const leave=msg=>{ch.state='left';npcSay(ctx,msg,()=>pushMsg(ch,'sys','Le client est parti.'),{o:'leave'})};
  const accept=price=>npcSay(ctx,T.ok(price),()=>doSale(m,ch,price),{o:'accept',p:price});
  const offer=price=>{
    if(price<=ch.max+1e-9){accept(price);return}
    const gap=(price-ch.max)/ch.max,cap=money(ch.max);
    if(gap<=.18&&ch.rounds<3&&cap>ch.lastOffer){
      let c=money(ch.lastOffer+(price-ch.lastOffer)*rnd(.35,.6));c=Math.min(Math.max(c,ch.lastOffer+.5),cap);
      ch.lastOffer=c;ch.rounds++;npcSay(ctx,T.ctr(c),null,{o:'counter',p:c});
    }else{
      ch.patience--;
      if(ch.patience<=0||gap>.6)leave(T.no+' '+T.leave);else npcSay(ctx,T.no,null,{o:'refuse'});
    }
  };
  if(kind==='accept'){accept(ch.lastOffer);return}
  if(kind==='refuse'){leave(T.leave);return}
  if(kind==='offer'){offer(p);return}
  const t=(txt||'').toLowerCase(),n=parseNum(t);
  if(/(^|[^a-zà-ÿ])(con|connard|idiot|nul|débile|dégage|merde|pourri)([^a-zà-ÿ]|$)/.test(t)){leave('Pas la peine d\'être désagréable. Je pars.');return}
  if(n&&n>0&&n<1e6){offer(n);return}
  if(isOk(t)){accept(ch.lastOffer);return}
  if(hasAny(t,['non merci','pas intéress','pas interess','laisse tomber','jamais'])){leave(T.leave);return}
  if(hasAny(t,['dernier prix','dernier'])){const c=Math.min(money(ch.max),money(ch.lastOffer*1.1+.5));if(c>ch.lastOffer){ch.lastOffer=c;npcSay(ctx,T.ctr(c),null,{o:'counter',p:c})}else npcSay(ctx,'C\'est vraiment mon maximum : '+fmt(ch.lastOffer)+'.',null,{o:'chat'});return}
  if(hasAny(t,['état','etat','neuf','usé','use ','authentique','vrai','garantie','livraison','photo','défaut','defaut']))npcSay(ctx,'Merci pour les précisions ! Alors, '+fmt(ch.lastOffer)+', ça vous va ?',null,{o:'chat'});
  else if(hasAny(t,['bonjour','salut','coucou','hello','bonsoir']))npcSay(ctx,'Bonjour ! 😊 Alors, pour les '+fmt(ch.lastOffer)+' ?',null,{o:'chat'});
  else npcSay(ctx,'Je n\'ai pas bien compris… '+fmt(ch.lastOffer)+' pour l\'objet, c\'est oui ou non ?',null,{o:'chat'});
}

/* ---------- discussion avec un vendeur d'enchère ---------- */
function ensureAucChat(a){if(!a.chat)a.chat={msgs:[{from:'them',text:'Bonjour ! Une question sur '+ITEMS[a.item].name+' ?',t:Date.now()}],floor:money(a.val*rnd(.95,1.2)),rounds:0,counter:null,state:'open',busy:false};return a.chat}
function aucAction(ctx,kind,txt,p){
  const a=ctx.a,ch=ctx.chat;if(ch.state!=='open'||ch.busy)return;
  if(!S.vtm.auc.includes(a)){toast('Enchère terminée','bad');return}
  if(txt)pushMsg(ch,'me',txt);
  const t=(txt||'').toLowerCase();
  const offer=price=>{
    if(price>=ch.floor){
      npcSay(ctx,'Marché conclu à '+fmt(price)+' ! 🤝',()=>{if(buyNow(a,price)){ch.state='sold';pushMsg(ch,'sys','🛒 Tu as acheté '+ITEMS[a.item].name+' pour '+fmt(price))}else pushMsg(ch,'sys','Achat impossible (solde insuffisant).')},{o:'accept',p:price});
    }else if(price>=ch.floor*.88&&ch.rounds<3){
      const c=money(ch.floor*rnd(1,1.05));ch.rounds++;ch.counter=c;
      npcSay(ctx,pick(['Je peux descendre à '+fmt(c)+', c\'est mon dernier prix.','Allez, '+fmt(c)+' et c\'est à vous.']),null,{o:'counter',p:c});
    }else{
      ch.rounds++;
      if(ch.rounds>=3){ch.state='closed';npcSay(ctx,'Désolé, on ne se met pas d\'accord. Je clos la discussion.',()=>pushMsg(ch,'sys','Le vendeur a fermé la discussion.'),{o:'closed'})}
      else npcSay(ctx,pick(['C\'est une pièce rare, pas à ce prix.','Trop bas, désolé. Faites un effort !']),null,{o:'refuse'});
    }
  };
  if(kind==='accept'){offer(ch.counter);return}
  if(kind==='offer'){offer(p);return}
  const n=parseNum(t),q={o:'chat'};
  if(n&&n>0&&n<1e6)offer(n);
  else if(kind==='dispo'||hasAny(t,['dispo','toujours']))npcSay(ctx,'Oui, l\'enchère est en cours ! Prix actuel : '+fmt(a.price)+'.',null,q);
  else if(kind==='etat'||hasAny(t,['état','etat','usé','neuf','défaut']))npcSay(ctx,pick(['Très bon état, comme sur les photos.','Quelques traces d\'usure, rien de grave.','Quasi neuf, très peu utilisé.']),null,q);
  else if(kind==='auth'||hasAny(t,['authentique','vrai','faux','certificat','original']))npcSay(ctx,pick(['100 % authentique, certificat à l\'appui 👌','Je ne vends que du vrai, vous pouvez me faire confiance.']),null,q);
  else if(hasAny(t,['bonjour','salut','coucou','hello']))npcSay(ctx,'Bonjour ! Je vous écoute 🙂',null,q);
  else npcSay(ctx,'Je suis là pour toute question sur l\'objet. Vous pouvez aussi me faire une offre d\'achat direct 🙂',null,q);
}

      a+=q('cs-accept','✅ Accepter '+fmt(ch.lastOffer));

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const act=t.dataset.act,V=S.vtm;if(!V)return;
  const aById=id=>V.auc.find(x=>x.id==id);
  if(act==='close'){closeModal();return}
  if(act==='vtab'){vtmTab=t.dataset.v;beep(520,.04);renderVtm();return}
  if(act==='helpok'){S.vtmHelp=false;save();renderVtm();return}
  if(act==='helpon'){S.vtmHelp=true;save();renderVtm();return}
  if(act==='sfilter'){shopF=t.dataset.f;renderShop();return}
  if(act==='buyitem'){
    const it=ITEMS[t.dataset.id];if(S.bal+1e-9<it.price){toast('Il te manque '+fmt(r2(it.price-S.bal)),'bad');beep(160,.2,'sawtooth');return}
    S.bal=r2(S.bal-it.price);S.spent=r2(S.spent+it.price);S.inv.push({uid:V.uid++,id:it.id,paid:it.price});S.series.push(S.bal);
    save();updateBal();renderShop();toast(it.em+' '+it.name+' → ton inventaire','good');beep(700,.08,'triangle',.07);return}
  if(act==='bidq'){const a=aById(t.dataset.id);if(a)placeBid(a,minBid(a));return}
  if(act==='aucd'){const a=aById(t.dataset.id);if(a){modalCtx={kind:'aucd',a};renderAucModal()}return}
  if(act==='bidc'){const a=modalCtx&&modalCtx.a;if(a)placeBid(a,parseFloat($('#am-in').value)||0);return}
  if(act==='buyout'){const a=modalCtx&&modalCtx.a;if(a&&confirm('Acheter '+ITEMS[a.item].name+' maintenant pour '+fmt(a.buy)+' ?')){if(buyNow(a,a.buy))closeModal()}return}
  if(act==='seller'){const a=modalCtx.a,ch=ensureAucChat(a);openChatSheet({kind:'auc',a,chat:ch},avatar(a.seller,34)+'<span>'+esc(a.seller)+'</span>','⭐ '+rating(a.seller)+' · '+ITEMS[a.item].name+' · actuel '+fmt(a.price));return}
  if(act==='ca-q'){aucAction(modalCtx,t.dataset.k,{dispo:'Il est toujours disponible ?',etat:'Quel est son état ?',auth:'C\'est bien authentique ?'}[t.dataset.k]);renderChat();return}
  if(act==='ca-accept'){aucAction(modalCtx,'accept','D\'accord pour '+fmt(modalCtx.chat.counter));renderChat();return}
  if(act==='send'){sendChat();return}
  if(act==='list'){openListSheet(+t.dataset.uid);return}
  if(act==='setp'){$('#ls-in').value=t.dataset.p;return}
  if(act==='newitem'){openNewSheet();return}
  if(act==='pickphoto'){const f=$('#np-file');if(f)f.click();return}
  if(act==='publishnew'){publishNew();return}
  if(act==='publish'){
    const p=money(parseFloat($('#ls-in').value)||0),uid=modalCtx.uid,inv=S.inv.find(i=>i.uid===uid);if(!inv)return;
    if(!(p>=.5)){toast('Prix invalide','bad');return}
    const m=V.mine.find(x=>x.uid===uid);
    if(m){m.price=p;m.chats.forEach(c=>{if(c.state==='open'&&c.lastOffer>p)c.lastOffer=p})}else V.mine.push({uid,id:inv.id,price:p,next:Date.now()+rnd(5,20)*1000,chats:[]});
    save();toast('📢 Annonce publiée : '+fmt(p),'good');beep(700,.08,'triangle',.07);closeModal();return}
  if(act==='unlist'){const m=V.mine.find(x=>x.uid==t.dataset.uid);if(m&&confirm('Retirer l\'annonce ? Les discussions seront fermées.')){removeListing(m);save();renderVtm()}return}
  if(act==='chat'){
    const m=V.mine.find(x=>x.uid==t.dataset.uid),ch=m&&m.chats.find(c=>c.id==t.dataset.cid);if(!ch)return;
    ch.unread=false;save();updateBadge();openChatSheet({kind:'sell',m,chat:ch},avatar(ch.buyer,34)+'<span>'+esc(ch.buyer)+'</span>',ITEMS[m.id].name+' · annonce '+fmt(m.price));return}
  if(act==='cs-accept'){const c=modalCtx;sellAction(c,'accept',c.chat.per==='arnaq'?'D\'accord.':'J\'accepte ton offre de '+fmt(c.chat.lastOffer)+'.');renderChat();return}
  if(act==='cs-offer'){const p=+t.dataset.p;sellAction(modalCtx,'offer','Je te le fais à '+fmt(p)+'.',p);renderChat();return}
  if(act==='cs-refuse'){sellAction(modalCtx,'refuse','Non merci, désolé.');renderChat();return}
  if(act==='cs-report'){const c=modalCtx;c.chat.state='reported';pushMsg(c.chat,'sys','🚩 Profil signalé et banni. Prime de vigilance : +2 €');S.bal=r2(S.bal+2);vlog('🚩 Arnaqueur signalé (+2 €)');save();updateBal();toast('🚩 Bien vu ! +2 €','good');jingle(false);renderChat();return}
});

    r.textContent='Test en cours…';
    try{const t=await aiCall('Tu es un client sympa sur une appli de petites annonces. Réponds en une courte phrase.',[{role:'user',content:'Bonjour, tu es là ?'}],60);r.textContent='✅ Ça marche ! Réponse : '+t}
    catch(e){r.textContent='❌ Échec : '+(e&&e.message?e.message:e)}
  };
  $('#st-secret').onclick=()=>{$('#st-secbox').classList.toggle('hidden');setTimeout(()=>$('#st-pw').focus(),50)};
  const tryPw=()=>{
    const v=$('#st-pw').value.trim().toLowerCase();$('#st-pw').value='';
    if(v==='boule'){S.bal=r2(S.bal+10);S.deposited=r2(S.deposited+10);save();updateBal();toast('🔓 +10 € !','good');jingle(true)}
    else{toast('Mot de passe incorrect','bad');beep(160,0.2,'sawtooth')}
  };
  $('#st-ok').onclick=tryPw;
  $('#st-pw').onkeydown=e=>{if(e.key==='Enter')tryPw()};
}

/* ================= ACCUEIL ================= */
function renderHome(){
  const left=864e5-(Date.now()-S.lastDaily),ready=left<=0,hh=Math.floor(left/36e5),mm=Math.floor(left%36e5/6e4);
  let h=`<div class="hero"><div style="font-size:40px;line-height:1.1">🎰</div><div class="t">CASINO FICTIF</div><div class="s">100 % argent fictif — aucun vrai argent, juste pour s'amuser</div></div>
   <div class="card" style="display:flex;align-items:center;gap:12px"><div style="font-size:30px">🎁</div><div style="flex:1"><b>Bonus quotidien</b><div class="muted">${ready?'+'+fmt(dailyValue())+' offerts !':'Prochain dans '+hh+' h '+mm+' min'}</div></div>
   <button class="btn sm" id="daily" ${ready?'':'disabled'}>Récupérer</button></div><div class="grid2">`;
  h+=GAMES.map(g=>{const o=S.owned.games.includes(g.id);return `<button class="gc ${o?'':'lock'}" data-game="${g.id}"><span class="em">${g.em}</span><b>${g.name}</b><small>${g.desc}</small>${o?'':`<span class="tag">🔒 ${fmt(g.price)}</span>`}</button>`}).join('');
  h+='</div>';$('#home').innerHTML=h;
}
$('#home').onclick=e=>{
  if(e.target.closest('#daily')){claimDaily();return}
  const g=e.target.closest('[data-game]');if(!g)return;const id=g.dataset.game;
  if(S.owned.games.includes(id)){beep(520,0.05);go('g-'+id)}else{toast('Débloque-le dans la boutique 🛒');go('shop')}
};

/* ================= démarrage ================= */
$('#snd').textContent=S.sound?'🔊':'🔇';
$('#bal').textContent=fmt(S.bal);
vtmInit();
go('home');updateBal();
requestAnimationFrame(frame);
</script>
