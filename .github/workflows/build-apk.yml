name: Construire l'APK

# Ce fichier fabrique l'APK de "Casino Fictif" sur les serveurs de GitHub.
# Il doit se trouver dans le dépôt à l'emplacement : .github/workflows/build-apk.yml
# À côté, à la racine du dépôt, il faut le fichier index.html (le jeu).

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

     

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Générer le projet Android autour du jeu
        run: |
          set -e
          test -f index.html || { echo "index.html introuvable à la racine du dépôt"; exit 1; }
          P=android
          J=$P/app/src/main/java/com/casinofictif/app
          R=$P/app/src/main/res
          mkdir -p "$J" "$R/values" "$R/drawable" "$P/app/src/main/assets"
          cp index.html "$P/app/src/main/assets/index.html"

          cat > $P/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CasinoFictif"
          include ':app'
          EOF

          cat > $P/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > $P/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > $P/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.casinofictif.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.casinofictif.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > $R/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Casino Fictif</string>
          </resources>
          EOF

          cat > $R/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">#0B0B1A</item>
                  <item name="android:navigationBarColor">#0B0B1A</item>
              </style>
          </resources>
          EOF

          cat > $R/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0B0B1A" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#FFD24A" android:pathData="M54,54m-34,0a34,34 0,1 1,68 0a34,34 0,1 1,-68 0" />
              <path android:fillColor="#7B4DE0" android:pathData="M54,54m-22,0a22,22 0,1 1,44 0a22,22 0,1 1,-44 0" />
              <path android:fillColor="#FFD24A" android:pathData="M54,40L66,58L42,58Z" />
          </vector>
          EOF

          cat > $J/MainActivity.java <<'EOF'
          package com.casinofictif.app;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor("#0B0B1A"));
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  web.setWebViewClient(new WebViewClient());
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }

              private void hideBars() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideBars();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
                  hideBars();
              }

              @Override
              protected void onPause() {
                  web.evaluateJavascript("window.__flush && window.__flush()", null);
                  web.onPause();
                  super.onPause();
              }

              @Override
              public void onBackPressed() {
                  web.evaluateJavascript("(window.__back && window.__back()) ? '1' : '0'", value -> {
                      if (!"\"1\"".equals(value)) finish();
                  });
              }
          }
          EOF

      - name: Compiler l'APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Préparer le fichier APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk casino-fictif.apk

      - uses: actions/upload-artifact@v4
        with:
          name: casino-fictif-apk
          path: casino-fictif.apk

      - name: Publier l'APK dans les Releases (téléchargement direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Casino Fictif — APK n°${{ github.run_number }}
          files: casino-fictif.apk
